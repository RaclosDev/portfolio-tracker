services:
  postgres:
    image: postgres:16-alpine
    container_name: cartera-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cartera}
      POSTGRES_USER: ${POSTGRES_USER:-cartera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cartera} -d ${POSTGRES_DB:-cartera}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartera-api
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cartera}
      PGUSER: ${POSTGRES_USER:-cartera}
      PGPASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PUBLIC_URL: http://localhost:8080
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

volumes:
  postgres_data:
