# Cartera: lista de vigilancia y cartera de acciones, ETF y fondos

# Servidor (Render inyecta PORT)
server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework

# Base de datos: Postgres en local (docker compose) y Neon en producción.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/cartera}
spring.datasource.username=${PGUSER:cartera}
spring.datasource.password=${PGPASSWORD:localdevpassword}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000
# Neon solo se duerme (y deja de gastar horas de cómputo) si no hay conexiones abiertas: el pool
# cierra las ociosas al minuto en vez de mantener 5 abiertas todo el día.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=60000
# Todo vive en el esquema «cartera»; los esquemas de la versión anterior quedan aparte como copia.
spring.datasource.hikari.schema=cartera

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=cartera
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=cartera
spring.flyway.default-schema=cartera
spring.flyway.create-schemas=true
spring.flyway.validate-on-migrate=true
spring.flyway.encoding=UTF-8
spring.flyway.placeholders.owner_email=${APP_OWNER_EMAIL:titular@localhost}

# Caché en memoria acotada (cotizaciones, búsquedas…)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=5000,expireAfterWrite=10m

# Tareas programadas (repaso de avisos, copias diarias)
spring.task.scheduling.pool.size=4

# Seguridad
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-minutes=15
app.jwt.refresh-days=180
app.public-url=${PUBLIC_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
# Cuenta propietaria que se crea en el primer arranque si no hay ninguna.
app.owner.email=${APP_OWNER_EMAIL:titular@localhost}
app.owner.password=${APP_PASSWORD:}
google.client.id=${GOOGLE_CLIENT_ID:}
app.registration-enabled=${REGISTRATION_ENABLED:true}

# Notificaciones Web Push (VAPID). Sin claves, no se envían.
app.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid-subject=${VAPID_SUBJECT:mailto:avisos@raclos.es}
# Repaso automático de avisos y copia diaria de cada usuario. Apagado en local para no tocar la copia de datos.
app.alerts.scheduler-enabled=${ALERTS_SCHEDULER:false}
# Cada cuántos segundos repasa el vigilante los precios (en memoria; no toca la base de datos si no hay novedades)
app.alerts.interval-seconds=${ALERTS_INTERVAL_SECONDS:10}

# Mercado
app.market.quote-ttl-seconds=${QUOTE_TTL_SECONDS:45}
app.market.targets-ttl-hours=${TARGETS_TTL_HOURS:12}

# Compresión
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/plain
server.compression.min-response-size=1024

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Un 1.5 donde se espera un entero es un error, no un 1.
spring.jackson.deserialization.accept-float-as-int=false

# Versión publicada (el commit en Render) para /api/health y el aviso de nueva versión.
app.version=${RENDER_GIT_COMMIT:${APP_VERSION:desarrollo}}
spring.threads.virtual.enabled=true

# El manifest de la PWA
server.mime-mappings.webmanifest=application/manifest+json
