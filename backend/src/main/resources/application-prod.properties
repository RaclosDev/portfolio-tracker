# Perfil de producción (SPRING_PROFILES_ACTIVE=prod en el Dockerfile). Se suma a application.properties.

logging.structured.format.console=ecs

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://cartera.raclos.es}
app.public-url=${PUBLIC_URL:https://cartera.raclos.es}

# Sin valores por defecto: si falta la base de datos, el arranque falla en vez de probar localhost.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
