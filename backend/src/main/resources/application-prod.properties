# Perfil de producción (SPRING_PROFILES_ACTIVE=prod en el Dockerfile). Se suma a application.properties.

logging.structured.format.console=ecs

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://cartera.raclos.es}
app.public-url=${PUBLIC_URL:https://cartera.raclos.es}
app.alerts.scheduler-enabled=${ALERTS_SCHEDULER:true}

# Sin valores por defecto: si falta la base de datos, el arranque falla en vez de probar localhost.
# DATABASE_URL puede ser la de Neon tal cual (postgresql://usuario:clave@host/bd): lleva dentro usuario y contraseña
# (DatabaseUrlEnvironmentPostProcessor). Con una URL jdbc: hacen falta PGUSER y PGPASSWORD.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# Antes de abrir el puerto se construye la primera pantalla de cada cuenta (WarmUp) y el DispatcherServlet se
# inicia al arrancar, no en la primera petición: la primera visita tras desplegar ya no paga la JVM fría.
app.warmup.enabled=${APP_WARMUP:true}
spring.mvc.servlet.load-on-startup=1
