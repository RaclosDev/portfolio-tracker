# Despliegue en Render (plan gratuito). Se crea con «New → Blueprint» apuntando a este repositorio.
# Render construye el Dockerfile de la raíz (web + API en una sola imagen). No se despliega en cada push:
# lo hace la GitHub Action cuando los tests pasan (RENDER_DEPLOY_HOOK).
services:
  - type: web
    name: cartera
    runtime: docker
    plan: free
    region: frankfurt # misma región que la base de datos de Neon (eu-central-1)
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Sin healthCheckPath: con 0,1 CPU una petición pesada retrasa la respuesta más de 5 s y Render
    # mataba la instancia. Sin ruta, Render solo comprueba que el puerto acepta conexiones.
    domains:
      - cartera.raclos.es
    envVars:
      - key: PUBLIC_URL
        value: https://cartera.raclos.es
      - key: CORS_ALLOWED_ORIGINS
        value: https://cartera.raclos.es
      # La cadena de Neon tal cual (postgresql://usuario:clave@host/base?sslmode=require).
      # También vale una URL jdbc: con PGUSER y PGPASSWORD aparte.
      - key: DATABASE_URL
        sync: false
      # Firma de los tokens de sesión (mínimo 32 bytes).
      - key: JWT_SECRET
        generateValue: true
      # Cuenta propietaria y su contraseña inicial.
      - key: APP_OWNER_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Notificaciones push (Web Push). Solo una instancia debe enviar los avisos.
      - key: ALERTS_SCHEDULER
        value: "true"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:avisos@raclos.es
