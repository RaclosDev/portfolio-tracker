# Verifica cada cambio y, si todo está bien en main, avisa al instante a las apps instaladas.
#  1. verificar: tipos, tests y compilación. Si algo falla, NO se avisa, y además las apps solo
#     instalan versiones cuyo job «verificar» haya terminado bien (lo comprueban en la API de
#     GitHub), así que un push roto nunca llega a los PCs.
#     En main, además, publica la versión ya compilada (Release «build-<commit>») que descargan las
#     apps: así los PCs no necesitan herramientas de compilación ni compilar al actualizar.
#  2. avisar: publica un mensaje en el canal de ntfy.sh de watchlist.update.json. Las apps lo
#     escuchan y comprueban la versión en GitHub (el mensaje no instala nada por sí solo).
name: Verificar y avisar de versión nueva

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # crear la Release con la versión compilada
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # no hace falta el binario de Electron para compilar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Compilación (web y escritorio)
        run: |
          npm run build -w @watchlist/web
          npm run build -w @watchlist/desktop
      - name: Publicar la versión compilada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/artefacto.mjs
          TAG="build-${GITHUB_SHA::12}"
          gh release create "$TAG" build/watchlist-app.zip --target "$GITHUB_SHA" --prerelease \
            --title "Compilación ${GITHUB_SHA::7}" --notes "Versión compilada para las apps instaladas (la descargan solas)."
          # Solo se guardan las 5 últimas compilaciones.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            xargs -r -n1 gh release delete --cleanup-tag --yes

  avisar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: watchlist.update.json
          sparse-checkout-cone-mode: false
      - name: Publicar aviso
        run: |
          TOPIC=$(jq -r '.pushTopic // empty' watchlist.update.json)
          if [ -z "$TOPIC" ]; then echo "Sin pushTopic: no se avisa"; exit 0; fi
          curl -fsS --retry 3 -H "Title: Watchlist" -d "version ${GITHUB_SHA}" "https://ntfy.sh/${TOPIC}"
